# ============================================================
# DimDim API - configuracao
# NENHUM dado sensivel fica aqui. Tudo vem de variavel de ambiente.
# ============================================================

spring.application.name=dimdim-api
server.port=8080

# ---------- Datasource Oracle ----------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Permite que a API suba mesmo se o Oracle ainda estiver iniciando.
# O Oracle no ACI leva alguns minutos no primeiro boot.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# ---------- JPA ----------
# O schema vem do DDL em db/init/01_ddl.sql. A aplicacao nao altera o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------- Log ----------
logging.level.root=INFO
logging.level.br.com.fiap.dimdim=DEBUG
